<svg xmlns="http://www.w3.org/2000/svg" width="720" height="248" viewBox="0 0 720 248" role="img" aria-labelledby="title desc">
  <title id="title">One skills folder, three agents</title>
  <desc id="desc">The project folder .agents/skills is read by Cursor and Codex. Claude Code reads the same skill folders from .claude/skills.</desc>
  <rect width="720" height="248" fill="#f4f1ea"/>
  <rect x="230" y="22" width="260" height="64" rx="12" fill="#fffcf7" stroke="#d9d1c3" stroke-width="1.5"/>
  <text x="360" y="50" text-anchor="middle" font-family="Liberation Sans, Nimbus Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1a16">.agents/skills/</text>
  <text x="360" y="70" text-anchor="middle" font-family="Liberation Sans, Nimbus Sans, Arial, sans-serif" font-size="12" fill="#5c564c">one project copy</text>
  <path d="M300 86 V118 H120 V140" fill="none" stroke="#8a8174" stroke-width="1.5"/>
  <path d="M360 86 V140" fill="none" stroke="#8a8174" stroke-width="1.5"/>
  <path d="M420 86 V118 H600 V140" fill="none" stroke="#8a8174" stroke-width="1.5"/>
  <g font-family="Liberation Sans, Nimbus Sans, Arial, sans-serif" text-anchor="middle">
    <rect x="36" y="140" width="168" height="72" rx="12" fill="#fffcf7" stroke="#d9d1c3" stroke-width="1.5"/>
    <text x="120" y="172" font-size="16" font-weight="700" fill="#1d1a16">Cursor</text>
    <text x="120" y="192" font-size="12" fill="#5c564c">reads this folder</text>
    <rect x="276" y="140" width="168" height="72" rx="12" fill="#fffcf7" stroke="#d9d1c3" stroke-width="1.5"/>
    <text x="360" y="172" font-size="16" font-weight="700" fill="#1d1a16">Codex</text>
    <text x="360" y="192" font-size="12" fill="#5c564c">reads this folder</text>
    <rect x="516" y="140" width="168" height="72" rx="12" fill="#fffcf7" stroke="#d9d1c3" stroke-width="1.5"/>
    <text x="600" y="168" font-size="16" font-weight="700" fill="#1d1a16">Claude Code</text>
    <text x="600" y="186" font-size="11" fill="#5c564c">same files, via</text>
    <text x="600" y="202" font-size="11" fill="#5c564c">.claude/skills</text>
  </g>
</svg>
